<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Product photograph coming soon">
  <!-- Brand sun-arc placeholder: gold-to-orange arc rising from the green baseline -->
  <rect width="800" height="800" fill="#F4F6FB"/>
  <defs>
    <linearGradient id="arc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDB913"/>
      <stop offset="100%" stop-color="#F26A21"/>
    </linearGradient>
  </defs>
  <path d="M 160 520 A 240 240 0 0 1 640 520" fill="none" stroke="url(#arc)" stroke-width="14" stroke-linecap="round"/>
  <line x1="120" y1="520" x2="680" y2="520" stroke="#3FA535" stroke-width="4" stroke-linecap="round"/>
  <text x="400" y="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#5A6784">Photograph coming soon</text>
</svg>
